[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codegraph-engine"
version = "2.1.8"
description = "Deep deterministic repository intelligence for AI coding agents (code, dependencies, databases, and runtime observations)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "CodeGraph contributors"}]
dependencies = ["pydantic>=2.7", "typer>=0.12", "mcp>=1.0,<2"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/raghurammrsd/CODE_GRAPH_MCP"
Repository = "https://github.com/raghurammrsd/CODE_GRAPH_MCP"
Documentation = "https://github.com/raghurammrsd/CODE_GRAPH_MCP/blob/main/docs/agent-brain.md"
Changelog = "https://github.com/raghurammrsd/CODE_GRAPH_MCP/blob/main/CHANGELOG.md"
Issues = "https://github.com/raghurammrsd/CODE_GRAPH_MCP/issues"

[project.optional-dependencies]
mcp = ["mcp>=1.0,<2"]
system = ["psutil>=5.9"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
codegraph = "codegraph.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["codegraph.mcp.server"]
disable_error_code = ["untyped-decorator"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["psutil.*", "psutil", "yaml.*", "yaml"]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

