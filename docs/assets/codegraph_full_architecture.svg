  <text class="header-title" x="112" y="104">AI Coding Agents &amp; Editor Environments</text>
  <text class="body-text" x="42" y="128">
    <tspan fill="#58a6ff" font-weight="700">Cursor</tspan> • <tspan fill="#58a6ff" font-weight="700">Claude Code</tspan> • <tspan fill="#58a6ff" font-weight="700">GitHub Copilot</tspan> • <tspan fill="#58a6ff" font-weight="700">Antigravity</tspan> • <tspan fill="#58a6ff" font-weight="700">Cline / Roo Code</tspan> • <tspan fill="#58a6ff" font-weight="700">Windsurf</tspan> • <tspan fill="#58a6ff" font-weight="700">Codex CLI</tspan> • <tspan fill="#58a6ff" font-weight="700">Gemini CLI</tspan>
  </text>
  <text class="code-lbl" x="690" y="128">Model Context Protocol (stdio / SSE HTTP transport on :8765)</text>

