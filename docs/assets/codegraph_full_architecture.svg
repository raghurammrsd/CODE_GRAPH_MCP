  <text class="body-text" x="584" y="336">PR Risk Score (0-100: LOW..CRITICAL)</text>
  <text class="body-text" x="584" y="352">Breaking change detection flags</text>
  <text class="body-text" x="584" y="368">Smart test command generator</text>
  <text class="body-text" x="574" y="390">• <tspan fill="#f2cc60">Safe Refactoring (safe_rename):</tspan></text>
  <text class="body-text" x="584" y="408">Pre-flight AST syntax check</text>
  <text class="body-text" x="584" y="424">Atomic sibling swap (os.replace)</text>
  <text class="body-text" x="584" y="440">Rollback manifest &amp; lock</text>
  <text class="body-text" x="574" y="462">• <tspan fill="#f2cc60">Git Intelligence (git-state/diff):</tspan></text>
  <text class="body-text" x="584" y="480">Structural AST diffs &amp; merge conflicts</text>
  <text class="body-text" x="574" y="508" fill="#8b949e">Sub-5ms commit diff fast path</text>
  <text class="code-lbl" x="574" y="560">11 DB Tools • 6 Git Tools</text>

  <!-- COLUMN 4: Live Watcher & Storage Engine -->
  <rect class="card-blue" x="824" y="156" width="248" height="434" />
  <rect class="badge-bg-blue" x="838" y="172" width="68" height="18" />
  <text class="code-badge" x="844" y="185">PILLAR 3</text>
  <text class="header-title" x="914" y="186">Live Watcher &amp; WAL</text>
  <text class="code-lbl" x="838" y="210">Sub-15ms Incremental Sync</text>
  <text class="body-text" x="838" y="230">• <tspan fill="#58a6ff">Zero-Heat Kernel Push Watcher:</tspan></text>
  <text class="body-text" x="848" y="248">macOS FSEvents / Linux inotify</text>
  <text class="body-text" x="848" y="264">Windows ReadDirectoryChangesW</text>
  <text class="body-text" x="848" y="280">250ms sliding debounce window</text>
  <text class="body-text" x="838" y="302">• <tspan fill="#58a6ff">Sub-15ms Incremental Reindex:</tspan></text>
  <text class="body-text" x="848" y="320">SHA-256 digest skip cache</text>
  <text class="body-text" x="848" y="336">Touches only modified files</text>
  <text class="code-lbl" x="848" y="352">Indexer.reindex_paths([paths])</text>
  <text class="body-text" x="838" y="374">• <tspan fill="#58a6ff">Instant In-Memory Cache Busting:</tspan></text>
  <text class="body-text" x="848" y="392">Purges _PARSE_CACHE &amp; _GRAPH_CACHE</text>
  <text class="body-text" x="848" y="408">Evicts context_cache table</text>
  <text class="body-text" x="838" y="430">• <tspan fill="#58a6ff">Lock-Free SQLite Concurrency:</tspan></text>
  <text class="code-lbl" x="848" y="448">PRAGMA journal_mode = WAL</text>
  <text class="code-lbl" x="848" y="464">PRAGMA synchronous = NORMAL</text>
  <text class="code-lbl" x="848" y="480">PRAGMA busy_timeout = 30000</text>
  <text class="body-text" x="838" y="508" fill="#8b949e">100% Local-First • Zero Remote Calls</text>
  <text class="code-lbl" x="838" y="560">70 Verified MCP Tools Total</text>
</svg>
