  <rect class="card-glow" x="28" y="156" width="248" height="434" />
  <rect class="badge-bg" x="42" y="172" width="68" height="18" />
  <text class="code-badge" x="48" y="185">PILLAR 1</text>
  <text class="header-green" x="118" y="186">Full-Stack Bridge</text>
  <text class="code-lbl" x="42" y="210">Frontend ↔ Backend Mapping</text>
  <text class="body-text" x="42" y="230">• <tspan fill="#7ee787">React Client Extraction:</tspan></text>
  <text class="code-green" x="52" y="248">fetch&lt;T&gt; / axios / useSWR</text>
  <text class="code-green" x="52" y="264">useQuery / $fetch (Nuxt/Vue)</text>
  <text class="body-text" x="42" y="286">• <tspan fill="#7ee787">Backend Route Normalizer:</tspan></text>
  <text class="body-text" x="52" y="304">FastAPI, Express, Django, Flask</text>
  <text class="body-text" x="52" y="320">NestJS (@Controller, @Get)</text>
  <text class="body-text" x="52" y="336">Next.js Server Actions &amp; App Router</text>
  <text class="body-text" x="42" y="358">• <tspan fill="#f0883e" font-weight="700">API Drift Engine (codegraph api-drift):</tspan></text>
  <text class="body-text" x="52" y="376">✔ Field name &amp; nullability drift</text>
  <text class="body-text" x="52" y="392">✔ TS Interface vs Pydantic / Zod</text>
  <text class="body-text" x="52" y="408">✔ Orphaned client endpoints</text>
  <text class="body-text" x="42" y="432">• <tspan fill="#7ee787">Template &amp; CSS Linkage:</tspan></text>
  <text class="body-text" x="52" y="450">Jinja2, Nunjucks, EJS, HTML templates</text>
  <text class="body-text" x="52" y="466">Tailwind &amp; CSS class extraction</text>
  <text class="body-text" x="42" y="492" fill="#8b949e">Resolves FETCHES_ROUTE &amp; CALLS</text>
  <text class="code-lbl" x="42" y="560">DATAFLOW_VERIFIED edges</text>

  <!-- COLUMN 2: PyTorch & AI/ML Stack -->
  <rect class="card-purple" x="294" y="156" width="248" height="434" />
  <rect class="badge-bg-purple" x="308" y="172" width="60" height="18" />
  <text class="code-badge" x="316" y="185">AI / ML</text>
  <text class="header-purple" x="376" y="186">PyTorch &amp; Agents</text>
  <text class="code-lbl" x="308" y="210">AI/ML Semantic Intelligence</text>
  <text class="body-text" x="308" y="230">• <tspan fill="#d2a8ff">PyTorch nn.Module Resolution:</tspan></text>
  <text class="code-lbl" x="318" y="248">model(x) → forward(x)</text>
  <text class="code-lbl" x="318" y="264">submodule(x) invocation trace</text>
  <text class="code-lbl" x="318" y="280">DISPATCHES_FORWARD edge</text>
  <text class="body-text" x="308" y="302">• <tspan fill="#d2a8ff">LangChain &amp; LlamaIndex:</tspan></text>
  <text class="body-text" x="318" y="320">@tool / @function_tool bindings</text>
  <text class="body-text" x="318" y="336">LCEL pipe flows: prompt | llm | out</text>
  <text class="code-lbl" x="318" y="352">CHAINS_TO pipeline traces</text>
  <text class="body-text" x="308" y="374">• <tspan fill="#d2a8ff">Distributed Ray Tasks:</tspan></text>
  <text class="body-text" x="318" y="392">@ray.remote &amp; task.remote() calls</text>
  <text class="code-lbl" x="318" y="408">DISPATCHES_RAY_TASK edge</text>
  <text class="body-text" x="308" y="430">• <tspan fill="#d2a8ff">Async Background Workers:</tspan></text>
  <text class="body-text" x="318" y="448">Celery (@task, delay()), BullMQ</text>
  <text class="body-text" x="318" y="464">RQ, Dramatiq task queues</text>
  <text class="body-text" x="308" y="492" fill="#8b949e">Tracks AI Agent tool dispatch &amp;</text>
  <text class="body-text" x="308" y="508" fill="#8b949e">model execution end-to-end</text>
  <text class="code-lbl" x="308" y="560">AST_VERIFIED / POSSIBLE</text>

  <!-- COLUMN 3: Database, Impact & Refactor -->
  <rect class="card-gold" x="560" y="156" width="248" height="434" />
  <rect class="badge-bg-gold" x="574" y="172" width="68" height="18" />
  <text class="code-badge" x="580" y="185">PILLAR 2</text>
  <text class="header-gold" x="650" y="186">Impact &amp; Database</text>
  <text class="code-lbl" x="574" y="210">PR Blast Radius &amp; Lineage</text>
