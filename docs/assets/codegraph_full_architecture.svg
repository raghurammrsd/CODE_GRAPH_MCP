  <text class="body-text" x="584" y="264">Django ORM, Mongoose (MongoDB)</text>
  <text class="code-lbl" x="584" y="280">READS_TABLE / WRITES_TABLE</text>
  <text class="body-text" x="574" y="302">• <tspan fill="#f2cc60">PR Blast Radius Engine (impact):</tspan></text>
