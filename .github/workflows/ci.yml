name: CI/CD Production Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck (Ruff + Mypy)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Ensure branch ref for detached HEAD in PRs
        run: git checkout -B ci-eval-head || true
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install --upgrade --retries 5 pip
          pip install --retries 5 -e '.[dev,mcp]'
      - name: Ruff Lint & Format Check
        run: ruff check .
      - name: Mypy Typecheck src/
        run: mypy src/ --ignore-missing-imports
      - name: Mypy Typecheck benchmarks/
        run: mypy benchmarks/ --ignore-missing-imports --explicit-package-bases

  unit-and-integration-tests:
    name: Full Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [lint-and-typecheck]
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Ensure branch ref for detached HEAD in PRs
        run: git checkout -B ci-eval-head || true
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install --upgrade --retries 5 pip
          pip install --retries 5 -e ".[dev,mcp]"
      - name: Run Windows Encoding & Process Lifecycle Tests
        run: python -m pytest tests/test_windows_and_process_lifecycle.py -v
      - name: Run Adversarial & Security Tests
        run: python -m pytest tests/test_adversarial_edge_cases.py -v
      - name: Run Determinism & Soak Tests
        run: python -m pytest tests/test_determinism_and_soak.py -v
      - name: Run Three Pillars & Full-Stack Tests
        run: python -m pytest tests/test_pillar1_fullstack_bridge.py tests/test_pillar2_change_impact.py tests/test_pillar3_incremental_watcher.py tests/test_safe_rename.py -v

  production-benchmark-regression:
    name: 50-Task Production Benchmark & Baseline Regression Gate
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Ensure branch ref for detached HEAD in PRs
        run: git checkout -B ci-eval-head || true
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install --upgrade --retries 5 pip
          pip install --retries 5 -e '.[dev,mcp]'
      - name: Run v2.1 Benchmark & Diagnostic Suite
        run: python3 benchmarks/run_v21_eval.py --output-dir benchmarks/reports/v2_1

  packaging-and-clean-install:
    name: Package Build & Clean Wheel Install
    runs-on: ubuntu-latest
    needs: [unit-and-integration-tests, production-benchmark-regression]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Ensure branch ref for detached HEAD in PRs
        run: git checkout -B ci-eval-head || true
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install --retries 5 build
      - name: Build wheel and sdist
        run: python -m build
      - name: Install Wheel in Isolated Environment
        run: |
          python -m venv test_env
          test_env/bin/pip install --retries 5 dist/*.whl
          test_env/bin/codegraph --version
          test_env/bin/codegraph --help
          test_env/bin/codegraph doctor --database
          test_env/bin/codegraph doctor --processes --json
          test_env/bin/codegraph stop --json

